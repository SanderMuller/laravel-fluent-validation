<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Laravel Fluent Validation">
    <defs>
        <!-- Body: deep red at bottom-left lifting to orange at the top-right corner. -->
        <linearGradient id="body" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#e51f0d"/>
            <stop offset="0.55" stop-color="#ff2d20"/>
            <stop offset="1" stop-color="#ff9a3c"/>
        </linearGradient>
        <!-- Glossy sheen across the upper half. -->
        <linearGradient id="sheen" x1="0" y1="0" x2="0.6" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <!-- Outer bloom, kept subtle so the mark still reads at favicon size. -->
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="6"/>
        </filter>
    </defs>

    <g filter="url(#glow)" opacity="0.55">
        <rect x="10" y="10" width="108" height="108" rx="30" fill="#ff2d20"/>
    </g>

    <rect x="10" y="10" width="108" height="108" rx="30" fill="url(#body)"/>
    <rect x="10" y="10" width="108" height="108" rx="30" fill="url(#sheen)"/>
    <rect x="11" y="11" width="106" height="106" rx="29" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="2"/>

    <path d="M40 66l17 17 33-38" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
