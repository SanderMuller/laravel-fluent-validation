name: Fix PHP code style issues

on:
  push:
    paths:
      - '**.php'
      - 'pint.json'
      - '.github/workflows/fix-php-code-style-issues.yml'
  pull_request:
    paths:
      - '**.php'
      - 'pint.json'
      - '.github/workflows/fix-php-code-style-issues.yml'

permissions:
  contents: read

jobs:
  php-code-styling:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The repo's own Pint on setup-php. The Docker image of
      # aglipanci/laravel-pint-action lost mbstring.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Check PHP code style
        run: |
          mkdir -p .cache/pint
          vendor/bin/pint --config pint.json --test -v
